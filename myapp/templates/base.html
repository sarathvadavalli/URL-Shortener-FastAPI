<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=2">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand" href="/">URL Shortener</a>
        <div class="navbar-nav ms-auto flex-row flex-wrap align-items-center">
            {% if is_authenticated %}
              <a class="nav-link" href="/home">Dashboard</a>
              <a class="nav-link" href="/urls">My URLs</a>
              <a class="nav-link" href="/urls/create">Create URL</a>
              <a class="nav-link" href="#" id="logoutLink">Log out</a>
            {% else %}
              <a class="nav-link" href="/auth/login">Log in</a>
            {% endif %}
        </div>
      </div>
    </nav>

    <div class="container app-content">
      {% block content %}{% endblock %}
    </div>

    <script>
        const logoutButton = document.getElementById("logoutLink");
        if (logoutButton) {
            logoutButton.addEventListener("click", async (event) => {
                event.preventDefault();
                await fetch("/auth/logout", { method: "POST" });
                window.location.replace("/auth/login");
            });
        }
    </script>
  </body>
</html>
